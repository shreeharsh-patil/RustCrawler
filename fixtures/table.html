<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Fixture</title>
</head>
<body>
    <article>
        <h1>Performance Comparison Matrix</h1>
        <table>
            <thead>
                <tr>
                    <th>Language</th>
                    <th>Runtime Model</th>
                    <th>Memory Usage</th>
                    <th>Throughput (req/s)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><b>Rust</b></td>
                    <td>Compiled / Native</td>
                    <td>15 MB</td>
                    <td>125,000</td>
                </tr>
                <tr>
                    <td>Go</td>
                    <td>GC / Goroutines</td>
                    <td>45 MB</td>
                    <td>90,000</td>
                </tr>
                <tr>
                    <td>Node.js</td>
                    <td>V8 Event Loop</td>
                    <td>110 MB</td>
                    <td>35,000</td>
                </tr>
                <tr>
                    <td>Python</td>
                    <td>CPython Asyncio</td>
                    <td>85 MB</td>
                    <td>12,000</td>
                </tr>
            </tbody>
        </table>
    </article>
</body>
</html>
