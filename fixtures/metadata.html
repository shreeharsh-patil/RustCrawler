<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
    <meta charset="utf-8">
    <title>Metadata Fixture Page</title>
    <meta name="description" content="Detailed page description for search indexers">
    <meta name="author" content="Systems Engineer">
    <meta name="robots" content="noindex, follow">
    <meta name="generator" content="RustCrawl Static 1.0">
    <meta name="theme-color" content="#2b3137">
    <link rel="canonical" href="https://example.com/canonical-meta">
    <link rel="shortcut icon" href="/favicon.png">

    <!-- Open Graph -->
    <meta property="og:title" content="OG Page Title">
    <meta property="og:description" content="OG Page Description">
    <meta property="og:image" content="https://example.com/og-image.jpg">
    <meta property="og:url" content="https://example.com/canonical-meta">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RustCrawl Docs">
    <meta property="og:locale" content="en_US">
    <meta property="article:published_time" content="2026-08-25T17:00:00Z">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Twitter Card Title">
    <meta name="twitter:description" content="Twitter Card Description">
    <meta name="twitter:image" content="/img/twitter-banner.png">
    <meta name="twitter:site" content="@rustcrawl">
    <meta name="twitter:creator" content="@author_handle">
</head>
<body>
    <h1>Metadata Demo</h1>
    <p>This fixture tests comprehensive meta, Open Graph, and Twitter metadata tags.</p>
</body>
</html>
